<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <script>
      // apply the saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem("terratriage:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>

    <title>NC Recon, North Carolina disaster monitor</title>
    <meta
      name="description"
      content="A North Carolina disaster monitor: live river-flood forecasts, streamflow, official warnings, storm tracking and DOT ground-truth, plus on-demand building-by-building damage assessment from satellite imagery."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="NC Recon, North Carolina disaster monitor" />
    <meta
      property="og:description"
      content="Live North Carolina risk monitoring, flood forecasts, warnings, storm tracks, and on-demand satellite damage assessment."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/groma.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEEEA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D1012" />

    <script>
      // apply the saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem("terratriage:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>

    <title>Groma · Disaster Assessment</title>
    <meta
      name="description"
      content="Building-by-building disaster damage assessment from before and after imagery, with the hard calls checked by people and live conditions alongside."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Groma · Disaster Assessment" />
    <meta
      property="og:description"
      content="Building-by-building disaster damage assessment, with evidence and confidence for every call."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
